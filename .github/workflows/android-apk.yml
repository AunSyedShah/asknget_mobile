name: Android APK

# A test build, not a store release. It produces an installable APK for
# com.asknget.app, signed with the default debug key from the Expo template.
# Runs by hand (Actions tab > "Android APK" > Run workflow) and on pushes to
# ci/android-apk. No secrets are used or needed.
on:
  workflow_dispatch:
  push:
    branches: [ci/android-apk]

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The native android/ folder is generated, never committed.
      - name: Generate the Android project
        run: npx expo prebuild --platform android --no-install

      # Lets Gradle install the SDK platform and build tools the template asks for.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      # arm64-v8a covers nearly every current Android phone and keeps the build small.
      - name: Build the release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: asknget-arm64-release
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
